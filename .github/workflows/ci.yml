name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify npm pack
        run: npm pack --dry-run

      - name: Check package structure
        run: |
          test -f extensions/graphify.ts
          test -f package.json
          test -f README.md
          test -f README.pt-BR.md
          test -f LICENSE
          echo "All expected files present"
